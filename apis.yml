aid: doubledutch
name: DoubleDutch
description: >-
  DoubleDutch was a San Francisco mobile event technology company backed by
  Bessemer Venture Partners. Its Developer Platform (DDDP) let event organizers
  and third-party developers build React Native extensions that install into
  any DoubleDutch event app, with a Firebase-backed data layer, a UI component
  library, an admin/CMS client, and a command-line interface — all published as
  official @doubledutch npm packages. DoubleDutch was acquired by Cvent in 2019
  and its technology now lives under Cvent's mobile event apps product;
  www.doubledutch.me redirects to Cvent. The developer surface (GitHub org, the
  doubledutch.github.io documentation site, and the npm packages) remains
  published but is unmaintained. There is no public REST OpenAPI — the platform
  is a client-side extension SDK rather than a hosted web API.
