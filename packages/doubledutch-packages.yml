source: https://www.npmjs.com/org/doubledutch
notes: >-
  First-party client libraries for the DoubleDutch Developer Platform (DDDP),
  an extension framework for DoubleDutch event apps. All packages are published
  under the official @doubledutch npm scope with repositories in the
  github.com/doubledutch org. DoubleDutch was acquired by Cvent (2019); the
  packages remain published but are no longer actively maintained (latest
  releases 2022). No REST OpenAPI is published — the platform is a React Native
  extension SDK, so these are the canonical client libraries.
